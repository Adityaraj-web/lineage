[package]
name = "lineage-vault"
version = "0.1.0"
edition = "2021"
description = "Lineage vault: agent payments gated by payee provenance"
license = "MIT"
repository = "https://github.com/Adityaraj-web/lineage"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
